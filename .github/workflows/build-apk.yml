name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add Messenger last-seen profile badge and reaction picker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/twoshare/app/ui/MessengerScreenV2.kt')
          s=p.read_text()
          s=s.replace(' val partnerStatus=remember(partner?.lastActiveAt,presenceTick){if(presence.label(partner?.lastActiveAt)=="Online")"Online" else "Offline"}\n', ' val partnerStatus=remember(partner?.lastActiveAt,presenceTick){if(presence.label(partner?.lastActiveAt)=="Online")"Online" else "Offline"}\n val lastSeenMessageId=remember(messages,uid){messages.lastOrNull{it.senderId==uid&&it.readAt!=null}?.id}\n', 1)
          old='MessageRow(item,uid,avatar,{replying=item;editing=null},{editing=item;replying=null;draft=item.body.orEmpty()},{e->react(item,e)},{failed->messages=messages.filterNot{it.id==failed.id};draft=failed.body.orEmpty()},{jumpTo(item.replyToId)})'
          new='MessageRow(item,uid,avatar,{replying=item;editing=null},{editing=item;replying=null;draft=item.body.orEmpty()},{e->react(item,e)},{failed->messages=messages.filterNot{it.id==failed.id};draft=failed.body.orEmpty()},{jumpTo(item.replyToId)},item.id==lastSeenMessageId,partnerPhoto)'
          if old not in s: raise SystemExit('MessageRow call not found')
          s=s.replace(old,new,1)
          old='@Composable private fun MessageRow(message:UiChatMessage,uid:String?,avatar:String?,reply:()->Unit,edit:()->Unit,react:(String)->Unit,retry:(UiChatMessage)->Unit,jumpToReply:()->Unit)'
          new='@Composable private fun MessageRow(message:UiChatMessage,uid:String?,avatar:String?,reply:()->Unit,edit:()->Unit,react:(String)->Unit,retry:(UiChatMessage)->Unit,jumpToReply:()->Unit,showSeenBadge:Boolean,seenPhoto:String?)'
          if old not in s: raise SystemExit('MessageRow signature not found')
          s=s.replace(old,new,1)
          marker='@OptIn(ExperimentalFoundationApi::class)\n@Composable private fun MessageRow'
          helper='@Composable private fun SeenBadge(photo:String?){Surface(Modifier.size(16.dp),shape=CircleShape,color=MaterialTheme.colorScheme.secondaryContainer,border=BorderStroke(1.dp,MaterialTheme.colorScheme.outlineVariant),shadowElevation=1.dp){if(photo!=null)AsyncImage(photo,"Seen by partner",Modifier.fillMaxSize(),contentScale=ContentScale.Crop)else Box(Modifier.fillMaxSize(),contentAlignment=Alignment.Center){Text("✓",fontSize=9.sp,color=MaterialTheme.colorScheme.primary)}}}\n@OptIn(ExperimentalFoundationApi::class)\n@Composable private fun MessageRow'
          if marker not in s: raise SystemExit('MessageRow marker not found')
          s=s.replace(marker,helper,1)
          old='if(showTime||message.localState!="sent")Text((if(showTime)absoluteTime(message.createdAt)else "")+if(mine){if(showTime)" · $receipt" else receipt}else "",style=MaterialTheme.typography.labelSmall);if(message.localState=="failed")'
          new='if(showTime||message.localState!="sent"||showSeenBadge)Row(verticalAlignment=Alignment.CenterVertically,horizontalArrangement=Arrangement.spacedBy(3.dp)){val receiptText=(if(showTime)absoluteTime(message.createdAt)else "")+if(mine){if(showTime)" · $receipt" else if(showSeenBadge)"Seen" else receipt}else "";if(receiptText.isNotBlank())Text(receiptText,style=MaterialTheme.typography.labelSmall,color=MaterialTheme.colorScheme.onSurfaceVariant);if(mine&&showSeenBadge)SeenBadge(seenPhoto)};if(message.localState=="failed")'
          if old not in s: raise SystemExit('Receipt line not found')
          s=s.replace(old,new,1)
          old='TextButton(onClick={actions=false;emojiPicker=true}){Text("+")}'
          new='IconButton(onClick={actions=false;emojiPicker=true},modifier=Modifier.size(36.dp)){Icon(Icons.Default.AddReaction,"More reactions",Modifier.size(22.dp))}'
          if old not in s: raise SystemExit('More reaction button not found')
          s=s.replace(old,new,1)
          old='@Composable private fun EmojiPickerDialog(onDismiss:()->Unit,onEmoji:(String)->Unit){var emoji by remember{mutableStateOf("")};val focus=remember{FocusRequester()};AlertDialog(onDismissRequest=onDismiss,title={Text("Choose any emoji")},text={OutlinedTextField(emoji,{emoji=it.take(16)},Modifier.fillMaxWidth().focusRequester(focus),singleLine=true,keyboardOptions=KeyboardOptions(keyboardType=KeyboardType.Text),placeholder={Text("😀")});LaunchedEffect(Unit){delay(150);focus.requestFocus()}},confirmButton={TextButton(onClick={onEmoji(emoji)},enabled=emoji.isNotBlank()){Text("React")}},dismissButton={TextButton(onClick=onDismiss){Text("Cancel")}})}'
          new='@Composable private fun EmojiPickerDialog(onDismiss:()->Unit,onEmoji:(String)->Unit){val all=listOf("❤️","👍","😂","😍","🥰","😘","😊","😁","🤣","😮","😢","😭","😡","🤔","🙏","👏","🎉","🔥","💯","✨","💪","👌","🙌","🤗");AlertDialog(onDismissRequest=onDismiss,title={Text("Choose a reaction")},text={Column(verticalArrangement=Arrangement.spacedBy(8.dp)){all.chunked(6).forEach{row->Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.SpaceEvenly){row.forEach{e->Surface(shape=CircleShape,color=MaterialTheme.colorScheme.surfaceContainerHigh,modifier=Modifier.size(42.dp).clickable{onEmoji(e)}){Box(Modifier.fillMaxSize(),contentAlignment=Alignment.Center){Text(e,fontSize=24.sp)}}}}}}},confirmButton={},dismissButton={TextButton(onClick=onDismiss){Text("Cancel")}})}'
          if old not in s: raise SystemExit('Emoji picker dialog not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Stabilize feed reactions and Messenger updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/twoshare/app/ui/FeedScreen.kt');s=p.read_text()
          old=' fun react(post:FeedPost,emoji:String){scope.launch{runCatching{reactionRepo.react(post.id,emoji)}.onSuccess{reactions=reactionRepo.load()}.onFailure{error=friendlyError(it,"Reaction failed.")}}}'
          new=' fun react(post:FeedPost,emoji:String){val current=repository.currentUserId()?:return;val before=reactions;val postMap=reactions[post.id].orEmpty();val mine=postMap.entries.firstOrNull{current in it.value}?.key;val updated=postMap.mapValues{(_,users)->users-current}.filterValues{it.isNotEmpty()}.toMutableMap();if(mine!=emoji)updated[emoji]=updated[emoji].orEmpty()+current;reactions=reactions.toMutableMap().apply{put(post.id,updated)};scope.launch{runCatching{reactionRepo.react(post.id,emoji)}.onFailure{t->reactions=before;val raw=t.localizedMessage.orEmpty().lowercase();if(!("session" in raw&&"expired" in raw))error=friendlyError(t,"Reaction failed.")}}}'
          if old not in s: raise SystemExit('Feed react function not found')
          p.write_text(s.replace(old,new,1))
          p=Path('app/src/main/java/com/twoshare/app/data/FeedReactionRepository.kt');s=p.read_text();old='        val uid = base.currentUserId() ?: error("Session expired")';new='        val uid = base.currentUserId() ?: return'
          if old not in s: raise SystemExit('Feed reaction session line not found')
          p.write_text(s.replace(old,new,1))
          p=Path('app/src/main/java/com/twoshare/app/ui/MessengerScreenV2.kt');s=p.read_text()
          old='if(!initialUnreadCaptured){unreadDividerId=server.firstOrNull{it.senderId!=uid&&it.readAt==null}?.id;initialUnreadCaptured=true}';new='if(unreadDividerId==null){unreadDividerId=server.firstOrNull{it.senderId!=uid&&it.readAt==null}?.id};initialUnreadCaptured=true'
          if old not in s: raise SystemExit('Unread capture logic not found')
          s=s.replace(old,new,1)
          old='var initialScrollDone by remember{mutableStateOf(false)}';new='var initialScrollDone by remember{mutableStateOf(false)};var previousTimelineSize by remember{mutableIntStateOf(0)}'
          if old not in s: raise SystemExit('Initial scroll state not found')
          s=s.replace(old,new,1)
          old='LaunchedEffect(timeline.size){if(!initialScrollDone&&timeline.isNotEmpty()){delay(100);val count=listState.layoutInfo.totalItemsCount;if(count>0){runCatching{listState.scrollToItem(timeline.lastIndex.coerceAtMost(count-1))};initialScrollDone=true}}}'
          new='LaunchedEffect(timeline.size){if(!initialScrollDone&&timeline.isNotEmpty()){delay(100);val count=listState.layoutInfo.totalItemsCount;if(count>0){runCatching{listState.scrollToItem(timeline.lastIndex.coerceAtMost(count-1))};initialScrollDone=true}}else if(initialScrollDone&&timeline.size>previousTimelineSize&&listState.firstVisibleItemIndex>=(previousTimelineSize-8).coerceAtLeast(0)){delay(80);runCatching{listState.animateScrollToItem(timeline.lastIndex)}};previousTimelineSize=timeline.size}'
          if old not in s: raise SystemExit('Timeline scroll effect not found')
          s=s.replace(old,new,1)
          old='itemsIndexed(timeline,key={_,entry->when(val item=entry.second){is UiChatMessage->"m-${item.id}";is CallRow->"c-${item.id}";else->entry.first.toString()}}){_,entry->val item=entry.second;'
          new='itemsIndexed(timeline,key={_,entry->when(val item=entry.second){is UiChatMessage->"m-${item.id}";is CallRow->"c-${item.id}";else->entry.first.toString()}}){_,entry->Box(Modifier.animateItem(fadeInSpec=androidx.compose.animation.core.tween(220),placementSpec=androidx.compose.animation.core.tween(320),fadeOutSpec=androidx.compose.animation.core.tween(160))){val item=entry.second;'
          if old not in s: raise SystemExit('Timeline items block not found')
          s=s.replace(old,new,1)
          old='}else CallLine(item as CallRow,uid)}}}}\n}'
          new='}else CallLine(item as CallRow,uid)}}}}}\n}'
          if old not in s: raise SystemExit('Timeline items close not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Generate TwoLink smooth jazz ringtone
        shell: bash
        run: |
          mkdir -p app/src/main/res/raw
          python3 - <<'PY'
          import wave, math, struct, random
          path='app/src/main/res/raw/twolink_smooth_jazz.wav'; sr=22050; duration=8.0; random.seed(7)
          chords=[(0,1.25,[261.63,329.63,392,493.88]),(1.3,1.25,[220,261.63,329.63,392]),(2.6,1.25,[293.66,349.23,440,523.25]),(3.9,1.25,[196,246.94,293.66,349.23]),(5.2,1.25,[261.63,329.63,392,493.88]),(6.5,1.3,[220,261.63,329.63,392])]
          lead=[(.18,.42,659.25),(.72,.34,587.33),(1.5,.48,523.25),(2.08,.32,493.88),(2.82,.4,440),(3.34,.38,523.25),(4.1,.5,587.33),(4.72,.3,493.88),(5.42,.42,659.25),(5.96,.34,783.99),(6.72,.58,659.25),(7.38,.35,587.33)]
          frames=bytearray()
          for i in range(int(sr*duration)):
              t=i/sr; x=0.0
              for st,dur,fs in chords:
                  dt=t-st
                  if 0<=dt<dur:
                      env=min(1,dt/.045)*max(0,min(1,(dur-dt)/.22))*math.exp(-.32*dt)
                      for f in fs: x+=.055*env*(math.sin(2*math.pi*f*dt)+.28*math.sin(4*math.pi*f*dt))
              for st,dur,f in lead:
                  dt=t-st
                  if 0<=dt<dur:
                      env=min(1,dt/.025)*max(0,min(1,(dur-dt)/.1))*math.exp(-dt)
                      x+=.20*env*(math.sin(2*math.pi*f*dt)+.20*math.sin(4*math.pi*f*dt))
              phase=t%(60/92)
              if phase<.07: x+=.018*math.exp(-45*phase)*random.uniform(-1,1)
              x*=max(0,min(1,t/.08,(duration-t)/.25)); x=max(-.95,min(.95,x)); frames+=struct.pack('<h',int(x*32767))
          with wave.open(path,'wb') as w:w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr);w.writeframes(frames)
          PY
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore persistent TwoShare signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: twoshare-debug-keystore-v1
      - name: Require exact TwoShare signing certificate
        shell: bash
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then echo "::error::TwoShare signing keystore is missing."; exit 1; fi
          EXPECTED_SHA256="F68AE9FE634515DB4143F64595CA6EB70B68CEC73A5615C7942C5D4CF65E6688"
          ACTUAL_SHA256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then echo "::error::TwoShare signing certificate mismatch."; exit 1; fi
      - name: Build release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify finished APK certificate
        shell: bash
        run: |
          EXPECTED_SHA256="F68AE9FE634515DB4143F64595CA6EB70B68CEC73A5615C7942C5D4CF65E6688"
          APK="app/build/outputs/apk/release/app-release.apk"
          ACTUAL_APK_SHA256="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          if [ "$ACTUAL_APK_SHA256" != "$EXPECTED_SHA256" ]; then echo "::error::Finished APK certificate mismatch."; exit 1; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwoShare-v1.0.23-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error