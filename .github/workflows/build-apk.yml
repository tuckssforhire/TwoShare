name: Check original TwoShare signing recovery
on:
  push:
    branches: [ tools/signing-recovery-20261114 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: twoshare-debug-keystore-v1
      - name: Check original signing key without exposing key contents
        env:
          RECOVERY_SECRETS: ${{ toJSON(secrets) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,re,subprocess,tempfile
          expected="F68AE9FE634515DB4143F64595CA6EB70B68CEC73A5615C7942C5D4CF65E6688"
          secrets=json.loads(os.environ["RECOVERY_SECRETS"])
          candidates=[(n,v) for n,v in secrets.items() if any(x in n.lower() for x in ("keystore","jks","signing_key")) and isinstance(v,str)]
          print("Signing-key secret candidates:",len(candidates))
          def matches(path):
              r=subprocess.run(["keytool","-list","-v","-keystore",str(path),"-storepass","android","-alias","androiddebugkey"],capture_output=True,text=True)
              return r.returncode==0 and expected in re.sub(r"[:\\s]","",r.stdout).upper()
          cached=pathlib.Path.home()/".android"/"debug.keystore"
          if cached.exists() and matches(cached):
              print("RECOVERY_RESULT: original signing key matched restored cache")
              raise SystemExit(0)
          with tempfile.TemporaryDirectory() as directory:
              for i,(name,value) in enumerate(candidates):
                  try:
                      data=base64.b64decode("".join(value.split()),validate=True)
                      path=pathlib.Path(directory)/str(i)
                      path.write_bytes(data)
                      path.chmod(0o600)
                      if matches(path):
                          cached.parent.mkdir(parents=True,exist_ok=True)
                          cached.write_bytes(data)
                          cached.chmod(0o600)
                          print("RECOVERY_RESULT: matching original key found in secret",name)
                          raise SystemExit(0)
                  except (ValueError,TypeError):
                      pass
          print("RECOVERY_RESULT: no matching original key in restored cache or signing-key secrets")
          PY
