name: Publish verified signed TwoShare 1.0.38
on:
  push:
    branches: [ release/publish-v1.0.38 ]
    paths: [ .github/workflows/publish-twoshare-release.yml ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install APK verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Fetch the externally signed APK
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, http.cookiejar
          from html.parser import HTMLParser
          url = 'https://drive.usercontent.google.com/download?id=1-t48WiJMSe1lz0oiOTM_24wOsziYbgwP&export=download&confirm=t'
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          response = op.open(url, timeout=120)
          if 'text/html' in response.headers.get('Content-Type', ''):
              class Form(HTMLParser):
                  def __init__(self):
                      super().__init__(); self.action = ''; self.fields = {}
                  def handle_starttag(self, tag, attrs):
                      a = dict(attrs)
                      if tag == 'form' and a.get('id') == 'download-form':
                          self.action = a.get('action', '')
                      if tag == 'input' and a.get('name'):
                          self.fields[a['name']] = a.get('value', '')
              f = Form(); f.feed(response.read().decode('utf-8'))
              if not f.action: raise SystemExit('Drive download confirmation form missing')
              response = op.open(f.action + '?' + urllib.parse.urlencode(f.fields), timeout=120)
          with open('TwoShare-v1.0.38.apk', 'wb') as out:
              while chunk := response.read(1024 * 1024): out.write(chunk)
          PY
      - name: Verify checksum, certificate and package version
        run: |
          echo 'cc511575c16914a073d9ef0d4a5ad0986b6e1a03b3b6cb6b4513081b7f24c6fa  TwoShare-v1.0.38.apk' | sha256sum --check
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs TwoShare-v1.0.38.apk
          actual="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs TwoShare-v1.0.38.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$actual" = 'b3790d1fbc5874b880962e91d8282f4f14cc819207a3f7f2cba1df64eebfef39'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging TwoShare-v1.0.38.apk | head -1 | grep "name='com.twoshare.app' versionCode='62' versionName='1.0.38'"
      - name: Publish verified signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## TwoShare 1.0.38
          - New Shared Lists tab: groceries, bucket lists, movies, places and custom lists.
          - Live updates for chat, reactions, edits, incoming calls and lists, with automatic reconnection and polling fallback.
          - More efficient chat refreshes and consistent Android builds.
          - Uses the permanent release signing key; updates 1.0.37 in place.
          EOF
          gh release create v1.0.38 TwoShare-v1.0.38.apk --repo "$GITHUB_REPOSITORY" --target 31302857629fd2486186da384856599917a01349 --title "TwoShare 1.0.38" --notes-file release-notes.md
