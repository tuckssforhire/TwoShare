name: Apply TwoShare UI Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI upgrade
        run: python3 .github/apply-ui-upgrade.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/twoshare/app/ui/MessengerScreenV2.kt
          git diff --cached --quiet || git commit -m "Apply Messenger UI patch"
          git push
