name: Build TwoShare Beta

on:
  push:
    branches: [ feature/v1.0.32-video-foundation ]
  workflow_dispatch:

jobs:
  beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Apply existing v1.0.31 build-time patches
        run: |
          python3 .github/apply-v1031-navigation.py
          python3 .github/apply-v1031-feed-crash-fix.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore isolated Beta signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: twoshare-beta-signing-v1
      - name: Create Beta signing certificate if missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=TwoShare Beta,O=TwoShare Development,C=PH"
          fi
      - name: Prepare isolated Beta configuration
        env:
          TWOSHARE_DEV_PUBLISHABLE_KEY: ${{ secrets.TWOSHARE_DEV_PUBLISHABLE_KEY }}
          TWOSHARE_BETA_FIREBASE_JSON: ${{ secrets.TWOSHARE_BETA_FIREBASE_JSON }}
        run: python3 .github/prepare-beta.py
      - name: Build Beta APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify Beta package and signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          PACKAGE=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test "$PACKAGE" = "com.twoshare.app.dev"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload isolated Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: TwoShare-v1.0.32-beta-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
