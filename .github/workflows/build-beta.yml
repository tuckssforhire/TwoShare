name: Build TwoShare Beta

on:
  push:
    branches: [ feature/v1.0.32-video-foundation ]
  workflow_dispatch:

jobs:
  beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Apply existing v1.0.31 build-time patches
        run: |
          python3 .github/apply-v1031-navigation.py
          python3 .github/apply-v1031-feed-crash-fix.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Generate TwoLink smooth jazz ringtone
        shell: bash
        run: |
          mkdir -p app/src/main/res/raw
          python3 - <<'PY'
          import wave, math, struct, random
          path='app/src/main/res/raw/twolink_smooth_jazz.wav'; sr=22050; duration=8.0; random.seed(7)
          chords=[(0,1.25,[261.63,329.63,392,493.88]),(1.3,1.25,[220,261.63,329.63,392]),(2.6,1.25,[293.66,349.23,440,523.25]),(3.9,1.25,[196,246.94,293.66,349.23]),(5.2,1.25,[261.63,329.63,392,493.88]),(6.5,1.3,[220,261.63,329.63,392])]
          lead=[(.18,.42,659.25),(.72,.34,587.33),(1.5,.48,523.25),(2.08,.32,493.88),(2.82,.4,440),(3.34,.38,523.25),(4.1,.5,587.33),(4.72,.3,493.88),(5.42,.42,659.25),(5.96,.34,783.99),(6.72,.58,659.25),(7.38,.35,587.33)]
          frames=bytearray()
          for i in range(int(sr*duration)):
              t=i/sr; x=0.0
              for st,dur,fs in chords:
                  dt=t-st
                  if 0<=dt<dur:
                      env=min(1,dt/.045)*max(0,min(1,(dur-dt)/.22))*math.exp(-.32*dt)
                      for f in fs: x+=.055*env*(math.sin(2*math.pi*f*dt)+.28*math.sin(4*math.pi*f*dt))
              for st,dur,f in lead:
                  dt=t-st
                  if 0<=dt<dur:
                      env=min(1,dt/.025)*max(0,min(1,(dur-dt)/.1))*math.exp(-dt)
                      x+=.20*env*(math.sin(2*math.pi*f*dt)+.20*math.sin(4*math.pi*f*dt))
              phase=t%(60/92)
              if phase<.07: x+=.018*math.exp(-45*phase)*random.uniform(-1,1)
              x*=max(0,min(1,t/.08,(duration-t)/.25)); x=max(-.95,min(.95,x)); frames+=struct.pack('<h',int(x*32767))
          with wave.open(path,'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr); w.writeframes(frames)
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore isolated Beta signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: twoshare-beta-signing-v1
      - name: Create Beta signing certificate if missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=TwoShare Beta,O=TwoShare Development,C=PH"
          fi
      - name: Prepare isolated Beta configuration
        env:
          TWOSHARE_DEV_PUBLISHABLE_KEY: ${{ secrets.TWOSHARE_DEV_PUBLISHABLE_KEY }}
          TWOSHARE_BETA_FIREBASE_JSON: ${{ secrets.TWOSHARE_BETA_FIREBASE_JSON }}
        run: python3 .github/prepare-beta.py
      - name: Build Beta APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify Beta package and signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          PACKAGE=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test "$PACKAGE" = "com.twoshare.app.dev"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload isolated Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: TwoShare-v1.0.32-beta-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
