name: Build test APK (separate TwoShare Test app)

# Installable test build for phones. It is a SEPARATE app (com.twoshare.app.uitest, named
# "TwoShare Test") signed with a throwaway key generated for each run, so it installs next to
# the real TwoShare without replacing it and never uses or exposes the release key.
# It uses the same Supabase data. Push notifications are disabled in it, because it shares
# the phone's device id with the real app and must not replace the real app's push token.
# Production releases still come only from build-apk.yml + offline signing (SIGNING.md).

on:
  push:
    branches: [ 'integration/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Generate TwoLink smooth jazz ringtone
        shell: bash
        run: |
          mkdir -p app/src/main/res/raw
          python3 - <<'PY'
          import wave, math, struct, random
          path='app/src/main/res/raw/twolink_smooth_jazz.wav'; sr=22050; duration=8.0; random.seed(7)
          chords=[(0,1.25,[261.63,329.63,392,493.88]),(1.3,1.25,[220,261.63,329.63,392]),(2.6,1.25,[293.66,349.23,440,523.25]),(3.9,1.25,[196,246.94,293.66,349.23]),(5.2,1.25,[261.63,329.63,392,493.88]),(6.5,1.3,[220,261.63,329.63,392])]
          lead=[(.18,.42,659.25),(.72,.34,587.33),(1.5,.48,523.25),(2.08,.32,493.88),(2.82,.4,440),(3.34,.38,523.25),(4.1,.5,587.33),(4.72,.3,493.88),(5.42,.42,659.25),(5.96,.34,783.99),(6.72,.58,659.25),(7.38,.35,587.33)]
          frames=bytearray()
          for i in range(int(sr*duration)):
              t=i/sr; x=0.0
              for st,dur,fs in chords:
                  dt=t-st
                  if 0<=dt<dur:
                      env=min(1,dt/.045)*max(0,min(1,(dur-dt)/.22))*math.exp(-.32*dt)
                      for f in fs: x+=.055*env*(math.sin(2*math.pi*f*dt)+.28*math.sin(4*math.pi*f*dt))
              for st,dur,f in lead:
                  dt=t-st
                  if 0<=dt<dur:
                      env=min(1,dt/.025)*max(0,min(1,(dur-dt)/.1))*math.exp(-dt)
                      x+=.20*env*(math.sin(2*math.pi*f*dt)+.20*math.sin(4*math.pi*f*dt))
              phase=t%(60/92)
              if phase<.07: x+=.018*math.exp(-45*phase)*random.uniform(-1,1)
              x*=max(0,min(1,t/.08,(duration-t)/.25)); x=max(-.95,min(.95,x)); frames+=struct.pack('<h',int(x*32767))
          with wave.open(path,'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr); w.writeframes(frames)
          PY

      - name: Configure separate TwoShare Test app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text()
          assert 'applicationId = "com.twoshare.app"' in text
          text = text.replace('applicationId = "com.twoshare.app"', 'applicationId = "com.twoshare.app.uitest"')
          text = re.sub(r'versionName = "([^"]+)"', r'versionName = "\1-test"', text, count=1)
          text = text.replace('buildConfigField("boolean", "PUSH_ENABLED", "true")', 'buildConfigField("boolean", "PUSH_ENABLED", "false")')
          assert '"PUSH_ENABLED", "false"' in text
          gradle.write_text(text)
          for path in (Path("app/google-services.json"), Path("google-services.json")):
              if path.exists():
                  config = json.loads(path.read_text())
                  for client in config.get("client", []):
                      info = client.get("client_info", {}).get("android_client_info", {})
                      if info.get("package_name") == "com.twoshare.app":
                          info["package_name"] = "com.twoshare.app.uitest"
                  path.write_text(json.dumps(config))
          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          assert 'android:label="TwoShare"' in text
          manifest.write_text(text.replace('android:label="TwoShare"', 'android:label="TwoShare Test"', 1))
          PY
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -dname "CN=TwoShare Test (throwaway)" -keyalg RSA -keysize 2048 -validity 365 >/dev/null 2>&1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build test APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: TwoShare-Test-${{ github.ref_name == 'main' && 'main' || github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
